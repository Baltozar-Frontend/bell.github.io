<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>София | Perfect Clicker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="user-profile">
        <input type="text" id="userName" class="name-input" placeholder="Введи имя...">
      </div>
      
      <div class="header-card">
        <div class="level-info">
          <div class="level-badge" id="levelDisplay">LVL 1</div>
          <div class="exp-track">
            <div class="exp-bar" id="expFill"></div>
          </div>
        </div>
        <div class="balance-display">
          <span id="clickCount">0</span> 💎
        </div>
      </div>
    </header>

    <div class="main-content">
      <aside class="shop-panel panel">
        <h2>АПГРЕЙДЫ</h2>
        <div class="upgrade-list">
          
          <button class="upgrade-item" id="btn-power">
            <div class="upg-info">
              <span class="upg-name">Сила клика</span>
              <span class="upg-desc" id="power-desc">+1 за клик</span>
            </div>
            <span class="upg-meta"><b id="cost-power">100</b> 💎</span>
          </button>

          <button class="upgrade-item" id="btn-auto">
            <div class="upg-info">
              <span class="upg-name">Автокликер</span>
              <span class="upg-desc" id="auto-desc">0/сек</span>
            </div>
            <span class="upg-meta"><b id="cost-auto">500</b> 💎</span>
          </button>

          <button class="upgrade-item" id="btn-gloves" style="display: none;">
            <div class="upg-info">
              <span class="upg-name">Gloves.glb</span>
              <span class="upg-desc">Множитель силы x10</span>
            </div>
            <span class="upg-meta"><b>100000</b> 💎</span>
          </button>
          
        </div>
      </aside>

      <main class="game-core" id="clicker-zone">
        <div class="main-image-container">
          <img src="./img/mamac sofia.jpg" alt="Click Me" class="main-image" id="main-target">
        </div>
      </main>

      <aside class="nav-panel panel">
        <h2>СЕТЬ</h2>
        <a href="img/crypto.html" class="nav-link">📈 Свино-Биржа (Хак)</a>
        <a target="_blank" href="./magazine/magazine.html" class="nav-link">📦 Магазин</a>
      </aside>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
